<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลังบ้าน | เติมเกมกับคุณนี้ด</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class="brand" href="/">♡ เติมเกมกับคุณนี้ด</a><nav><a href="/">กลับหน้าร้าน</a></nav></div></header><main class="wrap"><section class="hero compact"><h1>หลังบ้านร้านค้า 🔐</h1><p>จัดการออเดอร์และตรวจสอบสลิป</p></section><section class="card" id="loginCard"><h2>เข้าสู่ระบบแอดมิน</h2><form id="loginForm"><label>อีเมล<input id="email" type="email" autocomplete="username" required></label><label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">เข้าสู่ระบบ</button></form></section><section class="card hidden" id="dashboard"><div class="flex"><h2>รายการคำสั่งซื้อ</h2><button class="btn secondary" id="logout">ออกจากระบบ</button></div><p class="note">ตรวจสอบเงินเข้าบัญชีจริงก่อนกด “กำลังเติม” หรือ “สำเร็จ” • แสดง 200 ออเดอร์ล่าสุด</p><button class="btn secondary" id="refresh">รีเฟรชรายการ</button><div id="orders"></div></section><p id="message" role="status"></p></main><script src="/admin.js" defer></script></body></html>
